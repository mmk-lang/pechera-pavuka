# Автоматична публікація гри на GitHub Pages.
# Щоразу, коли код потрапляє в гілку main, GitHub сам запускає тести,
# збирає гру (npm run build) і викладає папку dist/ на сайт.

name: Публікація на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «Run workflow» для ручного запуску

permissions:
  contents: read
  pages: write
  id-token: write

# Якщо запущено дві публікації одразу — лишаємо лише останню
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test # якщо тести впали — гра не публікується
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
